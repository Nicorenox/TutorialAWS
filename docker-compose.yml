services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: tienda_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambia_esta_clave_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py migrate && gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: tienda_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-cambia_esta_clave_local}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,3.82.16.109"
    volumes:
      - static_data:/app/staticfiles

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web

  pagos_flask:
    build: ./microservicio_pagos
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:

